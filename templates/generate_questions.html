{% extends "base.html" %}

{% block title %}AI出题{% endblock %}

{% block content %}
<div class="generate-questions">
    <h2>AI出题</h2>
    <form method="POST" id="questionForm">
        <div class="form-group">
            <label for="topic">主题</label>
            <select id="topic" name="topic" required>
                {% for topic in topicList %}
                   <option value="{{topic}}">{{topic}}</option>
                {% endfor %}
            </select>
        </div>
        
        <div class="form-group">
            <label for="difficulty">难度 (1-3)</label>
            <input type="number" id="difficulty" name="difficulty" min="1" max="3" value="2" required>
        </div>
        
        <div class="form-group">
            <label for="language">编程语言</label>
            <select id="language" name="language" required>
                <option value="python">Python</option>
                <option value="java">Java</option>
                <option value="c">C</option>
                <option value="perl">Perl</option>
            </select>
        </div>
        
        <div class="form-group">
            <label for="count">生成数量</label>
            <input type="number" id="count" name="count" min="1" max="100" value="5" required>
        </div>
        
        <div class="form-group">
            <label for="ai_model">AI模型</label>
            <select id="ai_model" name="ai_model" required>
                <option value="qwen2.5-coder:32b">Qwen Coder</option>
                <option value="deepseek-r1:7b">DeepSeek R1</option>
                <option value="deepseek-coder:33b">DeepSeek Coder</option>
                <option value="codellama:7b">CodeLlama</option>
                <option value="deepseek_API">DeepSeek API</option>
            </select>
        </div>
        
        <button type="submit" class="btn primary">生成题目</button>
    </form>
    
    <!-- 进度栏容器 -->
    <div id="progressContainer" class="progress-container" style="display: none; margin-top: 20px;">
        <h3>生成进度</h3>
        <div class="progress-bar">
            <div class="progress-bar-inner" id="progressBar"></div>
        </div>
        <p id="progressText">正在准备生成题目...</p>
    </div>
</div>

<style>
.progress-container {
    border: 1px solid #ddd;
    padding: 15px;
    border-radius: 5px;
    background-color: #f9f9f9;
}

.progress-bar {
    width: 100%;
    height: 20px;
    background-color: #f0f0f0;
    border-radius: 10px;
    overflow: hidden;
    margin: 10px 0;
}

.progress-bar-inner {
    height: 100%;
    width: 0%;
    background-color: #4caf50;
    border-radius: 10px;
    transition: width 0.3s ease;
}

#progressText {
    text-align: center;
    margin: 5px 0;
}
</style>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const form = document.getElementById('questionForm');
    const progressContainer = document.getElementById('progressContainer');
    const progressBar = document.getElementById('progressBar');
    const progressText = document.getElementById('progressText');
    
    form.addEventListener('submit', function(e) {
        e.preventDefault();
        
        // 获取题目数量
        const count = parseInt(document.getElementById('count').value);
        
        // 显示进度容器
        progressContainer.style.display = 'block';
        
        // 禁用提交按钮防止重复提交
        const submitButton = form.querySelector('button[type="submit"]');
        submitButton.disabled = true;
        
        // 模拟进度更新（实际项目中应使用AJAX与后端通信）
        let current = 0;
        const interval = setInterval(() => {
            current++;
            const progress = (current / count) * 100;
            
            progressBar.style.width = progress + '%';
            progressText.textContent = `正在提交生成第 ${current} 道题目，共 ${count} 道（${Math.round(progress)}%）`;
            if (current >= count) {
                clearInterval(interval);
                
                // 延迟一下让用户看到100%进度，然后实际提交表单
                setTimeout(() => {
                    form.submit();
                }, 500);
            }
        }, 1000); // 模拟每道题生成需要1秒钟
        alert('AI出题任务已经提交至后台运行，可到后台任务菜单栏查看详情') 
    });
});
</script>
{% endblock %}
