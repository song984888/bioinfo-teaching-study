{% extends "base.html" %}

{% block title %}AI出题{% endblock %}

{% block content %}
<div class="generate-questions">
    <h2>程序设计题目生成</h2>
    <form method="POST" id="questionForm">
        <!-- 主题来源选择 -->
        <div class="form-group">
            <label>主题来源</label>
            <div class="topic-source-options" style="display:flex; gap:20px; padding:8px 0;">
                <label style="cursor:pointer; display:flex; align-items:center; gap:6px;">
                    <input type="radio" name="topic_source" value="template" checked onchange="toggleTopicSource()"> 模版题库
                </label>
                <label style="cursor:pointer; display:flex; align-items:center; gap:6px;">
                    <input type="radio" name="topic_source" value="knowledge_base" onchange="toggleTopicSource()"> 我的知识库
                </label>
                <label style="cursor:pointer; display:flex; align-items:center; gap:6px;">
                    <input type="radio" name="topic_source" value="custom" onchange="toggleTopicSource()"> 自定义主题
                </label>
            </div>
        </div>

        <!-- 模版题库 -->
        <div id="section-template">
            <div class="form-group">
                <label for="topic">选择主题</label>
                <select id="topic" name="topic">
                    {% for topic in topicList %}
                       <option value="{{topic}}">{{topic}}</option>
                    {% endfor %}
                </select>
            </div>
        </div>

        <!-- 我的知识库 -->
        <div id="section-kb" style="display:none;">
            <div class="form-group">
                <label for="kb_id">选择知识库</label>
                {% if user_kbs %}
                <select id="kb_id" name="kb_id" onchange="loadKBConcepts()">
                    <option value="">-- 请选择知识库 --</option>
                    {% for kb in user_kbs %}
                    <option value="{{ kb.id }}">{{ kb.name }} {% if kb.description %}({{ kb.description }}){% endif %}</option>
                    {% endfor %}
                </select>
                {% else %}
                <p style="color:#e67e22;">
                    您还没有自己的知识库，请先<a href="{{ url_for('knowledge_bases') }}">创建知识库</a>并上传文档提取概念。
                </p>
                <input type="hidden" name="kb_id" value="">
                {% endif %}
            </div>
            
            <!-- 概念选择区域 -->
            <div id="kb-concepts-section" style="display:none;">
                <div class="form-group">
                    <label>选择概念（可多选）</label>
                    <div id="kb-concepts-checkboxes" style="max-height:200px; overflow-y:auto; border:1px solid #ddd; border-radius:6px; padding:10px; background:#fafafa;">
                        <p style="color:#999; text-align:center; padding:10px;" id="concepts-loading">加载概念中...</p>
                    </div>
                    <div style="margin-top:6px; display:flex; gap:10px;">
                        <a href="javascript:void(0)" onclick="selectAllConcepts()" style="font-size:12px; color:#4a90d9;">全选</a>
                        <a href="javascript:void(0)" onclick="deselectAllConcepts()" style="font-size:12px; color:#999;">取消全选</a>
                        <span id="concepts-count" style="font-size:12px; color:#888; margin-left:auto;"></span>
                    </div>
                </div>
                
                <!-- 补充说明 -->
                <div class="form-group">
                    <label for="kb_supplement">补充说明</label>
                    <textarea id="kb_supplement" name="kb_supplement" rows="3" 
                              style="width:100%; resize:vertical;"
                              placeholder="请基于相关概念，生成程序设计题目，体现对概念的理解或者实现">请基于相关概念，生成程序设计题目，体现对概念的理解或者实现</textarea>
                    <p style="color:#888; font-size:12px; margin-top:2px;">
                        选中的概念名称会和补充说明一起作为主题发送给AI生成题目
                    </p>
                </div>
            </div>
        </div>

        <!-- 自定义主题 -->
        <div id="section-custom" style="display:none;">
            <div class="form-group">
                <label for="custom_topic">输入主题</label>
                <input type="text" id="custom_topic" name="custom_topic" 
                       placeholder="例如：数据结构与算法、生物信息学、Web开发..." 
                       style="width:100%;">
            </div>
        </div>
        
        <div class="form-group">
            <label for="difficulty">难度 (1-3)</label>
            <input type="number" id="difficulty" name="difficulty" min="1" max="3" value="2" required>
        </div>
        
        <div class="form-group">
            <label for="language">编程语言</label>
            <select id="language" name="language" required>
                <option value="python">Python</option>
                <option value="java">Java</option>
                <option value="c">C</option>
                <option value="perl">Perl</option>
            </select>
        </div>
        
        <div class="form-group">
            <label for="count">生成数量</label>
            <input type="number" id="count" name="count" min="1" max="100" value="5" required>
        </div>
        
        <div class="form-group">
            <label for="ai_model">AI模型</label>
            <select id="ai_model" name="ai_model" required>
                <option value="qwen2.5-coder:32b">Qwen Coder</option>
                <option value="deepseek-r1:7b">DeepSeek R1</option>
                <option value="deepseek-coder:33b">DeepSeek Coder</option>
                <option value="codellama:7b">CodeLlama</option>
                <option value="deepseek_API">DeepSeek API</option>
            </select>
        </div>
        
        <button type="submit" class="btn primary">生成题目</button>
    </form>
    
    <!-- 进度栏容器 -->
    <div id="progressContainer" class="progress-container" style="display: none; margin-top: 20px;">
        <h3>生成进度</h3>
        <div class="progress-bar">
            <div class="progress-bar-inner" id="progressBar"></div>
        </div>
        <p id="progressText">正在准备生成题目...</p>
    </div>
</div>

<style>
.progress-container {
    border: 1px solid #ddd;
    padding: 15px;
    border-radius: 5px;
    background-color: #f9f9f9;
}

.progress-bar {
    width: 100%;
    height: 20px;
    background-color: #f0f0f0;
    border-radius: 10px;
    overflow: hidden;
    margin: 10px 0;
}

.progress-bar-inner {
    height: 100%;
    width: 0%;
    background-color: #4caf50;
    border-radius: 10px;
    transition: width 0.3s ease;
}

#progressText {
    text-align: center;
    margin: 5px 0;
}

.topic-source-options label:hover {
    color: #4a90d9;
}
</style>

<script>
function toggleTopicSource() {
    const source = document.querySelector('input[name="topic_source"]:checked').value;
    document.getElementById('section-template').style.display = source === 'template' ? 'block' : 'none';
    document.getElementById('section-kb').style.display = source === 'knowledge_base' ? 'block' : 'none';
    document.getElementById('section-custom').style.display = source === 'custom' ? 'block' : 'none';
}

// ===== 知识库概念加载 =====
let allConcepts = [];

async function loadKBConcepts() {
    const kbId = document.getElementById('kb_id').value;
    const section = document.getElementById('kb-concepts-section');
    const container = document.getElementById('kb-concepts-checkboxes');
    
    if (!kbId) {
        section.style.display = 'none';
        return;
    }
    
    section.style.display = 'block';
    container.innerHTML = '<p style="color:#999; text-align:center; padding:10px;">加载概念中...</p>';
    
    try {
        const resp = await fetch(`/teacher/knowledge_bases/${kbId}/concepts`);
        const data = await resp.json();
        allConcepts = data.concepts || [];
        
        if (allConcepts.length === 0) {
            container.innerHTML = '<p style="color:#e67e22; text-align:center; padding:10px;">该知识库暂无概念，请先上传文档并提取概念</p>';
            document.getElementById('concepts-count').textContent = '';
            return;
        }
        
        container.innerHTML = allConcepts.map((c, i) => `
            <label style="display:inline-flex; align-items:center; gap:5px; margin:3px 8px 3px 0; cursor:pointer; font-size:13px;">
                <input type="checkbox" name="selected_concepts" value="${escapeHtmlAttr(c.concept_name)}" checked onchange="updateConceptCount()">
                ${escapeHtml(c.concept_name)}
                <span style="color:#aaa; font-size:11px;">(${c.total_frequency || 0})</span>
            </label>
        `).join('');
        updateConceptCount();
    } catch (err) {
        container.innerHTML = '<p style="color:#dc3545; text-align:center; padding:10px;">加载失败: ' + err.message + '</p>';
    }
}

function updateConceptCount() {
    const checked = document.querySelectorAll('input[name="selected_concepts"]:checked').length;
    document.getElementById('concepts-count').textContent = `已选 ${checked}/${allConcepts.length} 个概念`;
}

function selectAllConcepts() {
    document.querySelectorAll('input[name="selected_concepts"]').forEach(cb => cb.checked = true);
    updateConceptCount();
}

function deselectAllConcepts() {
    document.querySelectorAll('input[name="selected_concepts"]').forEach(cb => cb.checked = false);
    updateConceptCount();
}

function escapeHtmlAttr(str) {
    if (!str) return '';
    return str.replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/'/g, '&#39;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

document.addEventListener('DOMContentLoaded', function() {
    const form = document.getElementById('questionForm');
    const progressContainer = document.getElementById('progressContainer');
    const progressBar = document.getElementById('progressBar');
    const progressText = document.getElementById('progressText');
    
    form.addEventListener('submit', function(e) {
        e.preventDefault();
        
        // 验证：如果是自定义主题，必须有输入
        const topicSource = document.querySelector('input[name="topic_source"]:checked').value;
        if (topicSource === 'custom') {
            const customTopic = document.getElementById('custom_topic').value.trim();
            if (!customTopic) {
                alert('请输入自定义主题！');
                return;
            }
        }
        
        // 验证：如果是知识库，必须有知识库可选且至少选一个概念
        if (topicSource === 'knowledge_base') {
            const kbSelect = document.getElementById('kb_id');
            if (!kbSelect || !kbSelect.value) {
                alert('请先选择知识库！');
                return;
            }
            const checkedConcepts = document.querySelectorAll('input[name="selected_concepts"]:checked');
            if (checkedConcepts.length === 0) {
                alert('请至少选择一个概念！');
                return;
            }
        }
        
        const count = parseInt(document.getElementById('count').value);
        progressContainer.style.display = 'block';
        
        const submitButton = form.querySelector('button[type="submit"]');
        submitButton.disabled = true;
        
        let current = 0;
        const interval = setInterval(() => {
            current++;
            const progress = (current / count) * 100;
            progressBar.style.width = progress + '%';
            progressText.textContent = `正在提交生成第 ${current} 道题目，共 ${count} 道（${Math.round(progress)}%）`;
            if (current >= count) {
                clearInterval(interval);
                setTimeout(() => {
                    form.submit();
                }, 500);
            }
        }, 1000);
        alert('AI出题任务已经提交至后台运行，可到后台任务菜单栏查看详情');
    });
});
</script>
{% endblock %}
