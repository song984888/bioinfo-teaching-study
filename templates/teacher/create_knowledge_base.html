{% extends "base.html" %}

{% block title %}创建知识库{% endblock %}

{% block content %}
<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card">
                <div class="card-header">
                    <h4 class="mb-0">
                        <i class="fas fa-book"></i> 创建新知识库
                    </h4>
                </div>
                <div class="card-body">
                    <form method="POST">
                        <div class="mb-3">
                            <label for="name" class="form-label">知识库名称 *</label>
                            <input type="text" class="form-control" id="name" name="name" required>
                            <div class="form-text">为您的知识库起一个有意义的名称</div>
                        </div>
                        
                        <div class="mb-3">
                            <label for="description" class="form-label">描述</label>
                            <textarea class="form-control" id="description" name="description" rows="3" 
                                      placeholder="简要描述这个知识库的内容和用途..."></textarea>
                        </div>
                        
                        <div class="mb-3 form-check">
                            <input type="checkbox" class="form-check-input" id="is_public" name="is_public" value="1">
                            <label class="form-check-label" for="is_public">
                                设为公开
                                <small class="text-muted">(其他教师也可以访问)</small>
                            </label>
                        </div>
                        
                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-primary">
                                <i class="fas fa-save"></i> 创建知识库
                            </button>
                            <a href="{{ url_for('knowledge_bases') }}" class="btn btn-secondary">
                                <i class="fas fa-times"></i> 取消
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
