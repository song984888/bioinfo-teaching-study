{% extends "base.html" %}
{% block title %}Generate Questions{% endblock %}
{% block content %}
<h2>Generate Questions</h2>

<form method="POST" class="mt-3">
    <div class="row">
        <div class="col-md-6 mb-3">
            <label class="form-label">Topic</label>
            <input type="text" name="topic" class="form-control" required maxlength="100"
                   placeholder="e.g. array sorting, binary search">
        </div>
        <div class="col-md-6 mb-3">
            <label class="form-label">Language</label>
            <select name="language" class="form-select" required>
                <option value="python">Python</option>
                <option value="java">Java</option>
                <option value="c">C</option>
                <option value="perl">Perl</option>
            </select>
        </div>
    </div>
    <div class="row">
        <div class="col-md-6 mb-3">
            <label class="form-label">Difficulty (1-3)</label>
            <input type="number" name="difficulty" class="form-control" min="1" max="3" value="2" required>
        </div>
        <div class="col-md-6 mb-3">
            <label class="form-label">Count (1-20)</label>
            <input type="number" name="count" class="form-control" min="1" max="20" value="3" required>
        </div>
    </div>
    <button type="submit" class="btn btn-primary" onclick="this.innerHTML='Generating...';this.disabled=true;this.form.submit();">
        Generate Questions
    </button>
    <a href="{{ url_for('teacher_dashboard') }}" class="btn btn-outline-secondary">Back</a>
    <p class="text-muted mt-2 small">Question generation may take 10-30 seconds per question.</p>
</form>
{% endblock %}
