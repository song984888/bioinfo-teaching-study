<!DOCTYPE html>
<html>
<head>
    <title>知识图谱最终测试</title>
    <script src="/static/js/d3.min.js"></script>
    <style>
        body { margin: 20px; font-family: Arial, sans-serif; }
        #graph-container { width: 800px; height: 600px; border: 1px solid #ccc; }
        .node { cursor: pointer; }
        .label { font-size: 12px; text-anchor: middle; }
        .frequency { font-weight: bold; fill: white; }
    </style>
</head>
<body>
    <h1>知识图谱最终测试</h1>
    <div id="graph-container"></div>
    
    <script>
        console.log('开始测试知识图谱渲染...');
        
        // 测试数据
        const concepts = [
            {id: 1, concept_name: '算法', frequency: 5, size: 35, concept_type: 'entity'},
            {id: 2, concept_name: '数据结构', frequency: 3, size: 25, concept_type: 'entity'},
            {id: 3, concept_name: '编程语言', frequency: 2, size: 20, concept_type: 'entity'}
        ];
        
        const relations = [
            {from_concept_id: 1, to_concept_id: 2, confidence: 0.8},
            {from_concept_id: 2, to_concept_id: 3, confidence: 0.6}
        ];
        
        console.log('测试数据:', concepts, relations);
        
        try {
            // 获取容器
            const container = document.getElementById('graph-container');
            console.log('容器获取成功');
            
            // 创建SVG
            const svg = d3.select(container)
                .append('svg')
                .attr('width', 800)
                .attr('height', 600)
                .style('background', '#f8f9fa');
            console.log('SVG创建成功');
            
            // 网格布局
            const gridSize = Math.ceil(Math.sqrt(concepts.length));
            const cellSize = 150;
            
            concepts.forEach((concept, i) => {
                const row = Math.floor(i / gridSize);
                const col = i % gridSize;
                concept.x = (col + 0.5) * cellSize + 50;
                concept.y = (row + 0.5) * cellSize + 50;
            });
            
            console.log('网格布局计算完成');
            
            // 绘制连线
            relations.forEach(rel => {
                const source = concepts.find(c => c.id === rel.from_concept_id);
                const target = concepts.find(c => c.id === rel.to_concept_id);
                if (source && target) {
                    svg.append('line')
                        .attr('x1', source.x)
                        .attr('y1', source.y)
                        .attr('x2', target.x)
                        .attr('y2', target.y)
                        .attr('stroke', '#999')
                        .attr('stroke-width', rel.confidence * 3);
                }
            });
            
            // 绘制节点
            concepts.forEach(concept => {
                // 圆形
                svg.append('circle')
                    .attr('cx', concept.x)
                    .attr('cy', concept.y)
                    .attr('r', concept.size)
                    .attr('fill', concept.concept_type === 'entity' ? '#4361ee' : '#f72585')
                    .attr('stroke', '#fff')
                    .attr('stroke-width', 2);
                
                // 频率标签
                if (concept.frequency > 1) {
                    svg.append('text')
                        .attr('x', concept.x)
                        .attr('y', concept.y)
                        .attr('text-anchor', 'middle')
                        .attr('fill', 'white')
                        .attr('font-weight', 'bold')
                        .text(concept.frequency);
                }
                
                // 概念名称
                svg.append('text')
                    .attr('x', concept.x)
                    .attr('y', concept.y + concept.size + 15)
                    .attr('text-anchor', 'middle')
                    .attr('fill', '#333')
                    .text(concept.concept_name);
            });
            
            console.log('✅ 渲染成功！请查看图形');
            
        } catch (error) {
            console.error('❌ 渲染失败:', error);
            document.body.innerHTML += '<div style="color: red;">渲染错误: ' + error.message + '</div>';
        }
    </script>
</body>
</html>
