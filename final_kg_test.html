<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>知识图谱最终修复测试</title>
    <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
    <style>
        body { margin: 20px; font-family: Arial, sans-serif; }
        #graph-container { width: 800px; height: 600px; border: 2px solid #4361ee; border-radius: 8px; }
        .node { cursor: pointer; }
        .link { stroke: #999; stroke-opacity: 0.6; }
        .tooltip { 
            position: absolute; background: rgba(0,0,0,0.8); color: white; padding: 10px; 
            border-radius: 5px; pointer-events: none; font-size: 12px; z-index: 1000;
        }
    </style>
</head>
<body>
    <h1>知识图谱修复测试 - 最终版本</h1>
    <div id="graph-container"></div>

    <script>
        // 测试数据
        const nodes = [
            {id: 1, name: "算法", type: "entity", frequency: 3, size: 30},
            {id: 2, name: "数据结构", type: "entity", frequency: 2, size: 25},
            {id: 3, name: "编程语言", type: "entity", frequency: 1, size: 20},
            {id: 4, name: "循环", type: "entity", frequency: 3, size: 30},
            {id: 5, name: "条件", type: "entity", frequency: 2, size: 25}
        ];

        const links = [
            {source: 1, target: 2, value: 0.8},
            {source: 2, target: 3, value: 0.7},
            {source: 4, target: 5, value: 0.9}
        ];

        console.log('开始渲染...', nodes, links);

        function renderGraph() {
            const container = document.getElementById('graph-container');
            const width = container.clientWidth;
            const height = container.clientHeight;

            // 清空容器
            d3.select("#graph-container").selectAll("*").remove();

            // 创建SVG
            const svg = d3.select("#graph-container")
                .append("svg")
                .attr("width", width)
                .attr("height", height)
                .attr("style", "background-color: #fafafa; display: block;");

            console.log('SVG创建完成');

            // 创建力导向模拟
            const simulation = d3.forceSimulation(nodes)
                .force("charge", d3.forceManyBody().strength(-300))
                .force("center", d3.forceCenter(width / 2, height / 2))
                .force("collision", d3.forceCollide().radius(d => d.size + 10))
                .force("link", d3.forceLink(links).id(d => d.id).distance(150).strength(1));

            console.log('力模拟创建完成');

            // 初始化节点位置（避免聚集）
            nodes.forEach((node, i) => {
                node.x = width / 2 + Math.cos(i * 2 * Math.PI / nodes.length) * (width / 3);
                node.y = height / 2 + Math.sin(i * 2 * Math.PI / nodes.length) * (height / 3);
            });

            // 创建连线
            const link = svg.append("g")
                .selectAll("line")
                .data(links)
                .enter()
                .append("line")
                .attr("class", "link")
                .attr("stroke-width", d => Math.sqrt(d.value) * 2);

            // 创建节点
            const node = svg.append("g")
                .selectAll("circle")
                .data(nodes)
                .enter()
                .append("circle")
                .attr("class", "node")
                .attr("r", d => d.size)
                .attr("fill", d => d.type === 'entity' ? '#4361ee' : '#f72585')
                .attr("stroke", "#fff")
                .attr("stroke-width", 2)
                .call(drag(simulation));

            // 添加标签
            const label = svg.append("g")
                .selectAll("text")
                .data(nodes)
                .enter()
                .append("text")
                .text(d => d.name)
                .attr("x", d => d.x)
                .attr("y", d => d.y)
                .attr("text-anchor", "middle")
                .attr("fill", "#333")
                .attr("font-size", 12);

            // 更新位置
            simulation.on("tick", () => {
                link
                    .attr("x1", d => d.source.x)
                    .attr("y1", d => d.source.y)
                    .attr("x2", d => d.target.x)
                    .attr("y2", d => d.target.y);

                node
                    .attr("cx", d => d.x)
                    .attr("cy", d => d.y);

                label
                    .attr("x", d => d.x)
                    .attr("y", d => d.y);
            });

            // 拖拽功能
            function drag(simulation) {
                function dragstarted(event) {
                    if (!event.active) simulation.alphaTarget(0.3).restart();
                    event.subject.fx = event.subject.x;
                    event.subject.fy = event.subject.y;
                }

                function dragged(event) {
                    event.subject.fx = event.x;
                    event.subject.fy = event.y;
                }

                function dragended(event) {
                    if (!event.active) simulation.alphaTarget(0);
                    event.subject.fx = null;
                    event.subject.fy = null;
                }

                return d3.drag()
                    .on("start", dragstarted)
                    .on("drag", dragged)
                    .on("end", dragended);
            }

            // 鼠标悬停
            node.on("mouseover", function(event, d) {
                d3.select(this).attr("stroke-width", 4);
                
                const tooltip = d3.select("body").append("div")
                    .attr("class", "tooltip")
                    .style("left", (event.pageX + 10) + "px")
                    .style("top", (event.pageY - 10) + "px");
                    
                tooltip.html(`<strong>${d.name}</strong><br/>频率: ${d.frequency}次`);
            })
            .on("mouseout", function() {
                d3.select(this).attr("stroke-width", 2);
                d3.selectAll(".tooltip").remove();
            });

            console.log('渲染完成！');
        }

        // 页面加载完成后渲染
        document.addEventListener('DOMContentLoaded', function() {
            console.log('页面加载完成');
            try {
                renderGraph();
            } catch (error) {
                console.error('渲染失败:', error);
                document.body.innerHTML += `<p style="color: red;">渲染失败: ${error.message}</p>`;
            }
        });
    </script>
</body>
</html>
