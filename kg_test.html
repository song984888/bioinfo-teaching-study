<!DOCTYPE html>
<html>
<head>
    <title>知识图谱测试页面</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        #knowledge-graph { 
            width: 800px; 
            height: 600px; 
            border: 1px solid #ccc;
            position: relative;
        }
        .loading { 
            position: absolute; 
            top: 50%; 
            left: 50%; 
            transform: translate(-50%, -50%);
            text-align: center;
        }
    </style>
</head>
<body>
    <h1>知识图谱测试</h1>
    
    <div id="knowledge-graph">
        <div class="loading">
            <p>正在加载知识图谱...</p>
        </div>
    </div>
    
    <div style="margin-top: 20px;">
        <h3>调试信息:</h3>
        <div id="debug-info"></div>
    </div>

    <script>
        // 测试数据
        const concepts = [
            {id: 1, concept_name: '算法', frequency: 3, size: 30, concept_type: 'entity'},
            {id: 2, concept_name: '数据结构', frequency: 2, size: 25, concept_type: 'entity'},
            {id: 3, concept_name: '编程语言', frequency: 1, size: 20, concept_type: 'entity'}
        ];
        
        const relations = [
            {from_concept_id: 1, to_concept_id: 2, confidence: 0.8}
        ];
        
        console.log('测试数据加载完成');
        console.log('概念数量:', concepts.length);
        console.log('关系数量:', relations.length);
        
        // 更新调试信息
        document.getElementById('debug-info').innerHTML = `
            <p>概念数量: ${concepts.length}</p>
            <p>关系数量: ${relations.length}</p>
            <p>第一个概念: ${concepts[0]?.concept_name}</p>
        `;
        
        // 渲染知识图谱
        document.addEventListener('DOMContentLoaded', function() {
            console.log('DOM加载完成，开始渲染图谱');
            
            const container = document.getElementById('knowledge-graph');
            const width = container.clientWidth;
            const height = container.clientHeight;
            
            // 清除加载指示器
            container.innerHTML = '';
            
            // 创建SVG
            const svg = d3.select(container)
                .append('svg')
                .attr('width', width)
                .attr('height', height);
            
            console.log('SVG创建完成，尺寸:', width, 'x', height);
            
            // 使用网格布局
            const gridSize = Math.ceil(Math.sqrt(concepts.length));
            const cellSize = Math.min(width / gridSize, height / gridSize) * 0.8;
            
            concepts.forEach((concept, i) => {
                const row = Math.floor(i / gridSize);
                const col = i % gridSize;
                concept.x = (col + 0.5) * cellSize;
                concept.y = (row + 0.5) * cellSize;
            });
            
            console.log('网格布局计算完成');
            
            // 创建节点
            const nodes = svg.selectAll('.node')
                .data(concepts)
                .enter()
                .append('g')
                .attr('class', 'node');
            
            // 添加圆形
            nodes.append('circle')
                .attr('cx', d => d.x)
                .attr('cy', d => d.y)
                .attr('r', d => d.size)
                .attr('fill', d => {
                    const colors = {
                        'entity': '#4361ee',
                        'relation': '#f72585'
                    };
                    return colors[d.concept_type] || '#6c757d';
                })
                .attr('stroke', '#fff')
                .attr('stroke-width', 2);
            
            // 添加标签
            nodes.append('text')
                .attr('x', d => d.x)
                .attr('y', d => d.y + 5)
                .attr('text-anchor', 'middle')
                .attr('fill', '#333')
                .attr('font-size', '12px')
                .text(d => d.concept_name);
            
            // 添加频率标签
            nodes.filter(d => d.frequency > 1)
                .append('text')
                .attr('x', d => d.x)
                .attr('y', d => d.y)
                .attr('text-anchor', 'middle')
                .attr('fill', '#fff')
                .attr('font-weight', 'bold')
                .attr('font-size', '14px')
                .text(d => d.frequency);
            
            console.log('节点渲染完成');
        });
    </script>
</body>
</html>
