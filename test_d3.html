<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>D3.js 测试</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
        }
        #test-svg {
            border: 1px solid #ccc;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <h1>D3.js 加载测试</h1>
    <div id="status">正在检查 D3.js...</div>
    
    <svg id="test-svg" width="400" height="300"></svg>
    
    <!-- 引用本地D3.js -->
    <script src="/static/js/d3.min.js"></script>
    
    <script>
        console.log('=== D3.js 测试开始 ===');
        
        // 检查 D3.js 是否加载
        const statusDiv = document.getElementById('status');
        
        if (typeof d3 === 'undefined') {
            console.error('❌ D3.js 未加载');
            statusDiv.innerHTML = '<strong style="color: red;">❌ D3.js 未加载！请检查文件路径。</strong>';
        } else {
            console.log('✓ D3.js 已加载');
            console.log('D3.js 版本:', d3.version);
            statusDiv.innerHTML = '<strong style="color: green;">✓ D3.js 已成功加载！版本：</strong>' + (d3.version || '未知');
            
            // 尝试绘制一个简单的图形
            const svg = d3.select('#test-svg');
            
            // 清空 SVG
            svg.html('');
            
            // 添加一些测试数据
            const data = [
                { x: 50, y: 50, r: 30, color: '#4361ee', label: '概念 A' },
                { x: 200, y: 50, r: 40, color: '#f72585', label: '概念 B' },
                { x: 125, y: 150, r: 35, color: '#4cc9f0', label: '概念 C' }
            ];
            
            // 创建连线
            svg.append('line')
                .attr('x1', data[0].x)
                .attr('y1', data[0].y)
                .attr('x2', data[1].x)
                .attr('y2', data[1].y)
                .attr('stroke', '#999')
                .attr('stroke-width', 2);
            
            svg.append('line')
                .attr('x1', data[1].x)
                .attr('y1', data[1].y)
                .attr('x2', data[2].x)
                .attr('y2', data[2].y)
                .attr('stroke', '#999')
                .attr('stroke-width', 2);
            
            // 创建节点
            const nodes = svg.selectAll('circle')
                .data(data)
                .enter()
                .append('circle')
                .attr('cx', d => d.x)
                .attr('cy', d => d.y)
                .attr('r', d => d.r)
                .attr('fill', d => d.color)
                .attr('stroke', '#fff')
                .attr('stroke-width', 2);
            
            // 添加标签
            svg.selectAll('text')
                .data(data)
                .enter()
                .append('text')
                .attr('x', d => d.x)
                .attr('y', d => d.y)
                .attr('text-anchor', 'middle')
                .attr('fill', '#333')
                .attr('font-size', '14')
                .text(d => d.label);
            
            console.log('✓ 测试图形绘制完成');
            console.log('绘制的节点数:', data.length);
            console.log('绘制的连线数：2');
        }
        
        console.log('=== D3.js 测试结束 ===');
    </script>
</body>
</html>
