<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>知识图谱测试</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        #graph-container {
            width: 100%;
            height: 600px;
            border: 2px solid #ddd;
            background: white;
        }
        .node circle {
            stroke: #fff;
            stroke-width: 2px;
        }
        .link {
            stroke: #999;
            stroke-opacity: 0.6;
        }
        .label {
            font-size: 12px;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(255,255,255,0.8);
        }
    </style>
</head>
<body>
    <h1>知识图谱 D3.js 测试</h1>
    <div id="graph-container"></div>
    
    <script>
        // 测试数据
        const concepts = [
            { id: 1, concept_name: '贾宝玉', concept_type: 'entity', frequency: 2120, size: 50 },
            { id: 2, concept_name: '林黛玉', concept_type: 'entity', frequency: 1, size: 30 },
            { id: 3, concept_name: '薛姨妈', concept_type: 'entity', frequency: 910, size: 40 },
            { id: 4, concept_name: '王夫人', concept_type: 'entity', frequency: 1, size: 30 },
            { id: 5, concept_name: '凤姐儿', concept_type: 'entity', frequency: 908, size: 40 },
            { id: 6, concept_name: '毛泽东', concept_type: 'entity', frequency: 1, size: 30 },
            { id: 7, concept_name: '曹雪芹', concept_type: 'entity', frequency: 1, size: 30 },
            { id: 8, concept_name: '刘姥姥', concept_type: 'entity', frequency: 576, size: 35 }
        ];
        
        const relations = [
            { from_concept_id: 3, to_concept_id: 4, confidence: 1 },
            { from_concept_id: 5, to_concept_id: 6, confidence: 1 }
        ];
        
        console.log(' concepts:', concepts);
        console.log(' relations:', relations);
        
        // 容器尺寸
        const width = document.getElementById('graph-container').clientWidth;
        const height = 600;
        
        // 创建 SVG
        const svg = d3.select('#graph-container')
            .append('svg')
            .attr('width', width)
            .attr('height', height);
        
        // 准备数据
        const simulationData = {
            nodes: concepts.map(c => ({
                id: c.id,
                name: c.concept_name,
                frequency: c.frequency || 1,
                size: c.size || 30,
                type: c.concept_type
            })),
            links: relations.map(r => ({
                source: r.from_concept_id,
                target: r.to_concept_id,
                confidence: r.confidence || 1
            }))
        };
        
        console.log(' simulationData.nodes:', simulationData.nodes);
        console.log(' simulationData.links:', simulationData.links);
        
        // 创建力导向模拟
        const simulation = d3.forceSimulation(simulationData.nodes)
            .force('link', d3.forceLink(simulationData.links).id(d => d.id).distance(150))
            .force('charge', d3.forceManyBody().strength(-300))
            .force('center', d3.forceCenter(width / 2, height / 2).strength(0.2))
            .force('collide', d3.forceCollide().radius(d => d.size + 10).iterations(2));
        
        // 创建分组
        const linkGroup = svg.append('g').attr('class', 'links');
        const nodeGroup = svg.append('g').attr('class', 'nodes');
        const labelGroup = svg.append('g').attr('class', 'labels');
        
        // 绘制连线
        const links = linkGroup.selectAll('.link')
            .data(simulationData.links)
            .enter().append('line')
            .attr('class', 'link')
            .attr('stroke-width', d => Math.sqrt(d.confidence || 1) * 2);
        
        // 绘制节点
        const nodes = nodeGroup.selectAll('.node')
            .data(simulationData.nodes)
            .enter().append('circle')
            .attr('class', 'node')
            .attr('r', d => d.size)
            .attr('fill', d => {
                const colors = {
                    'entity': '#3498db',
                    'relation': '#e74c3c',
                    'attribute': '#2ecc71'
                };
                return colors[d.type] || '#f39c12';
            })
            .attr('stroke', '#2c3e50')
            .attr('stroke-width', '3px')
            .call(d3.drag()
                .on('start', dragstarted)
                .on('drag', dragged)
                .on('end', dragended));
        
        // 添加标签
        const labels = labelGroup.selectAll('.label')
            .data(simulationData.nodes)
            .enter().append('text')
            .attr('class', 'label')
            .attr('text-anchor', 'middle')
            .attr('fill', '#000')
            .attr('font-weight', 'bold')
            .text(d => `${d.name} (${d.frequency})`);
        
        // 更新位置
        simulation.on('tick', () => {
            links
                .attr('x1', d => d.source.x)
                .attr('y1', d => d.source.y)
                .attr('x2', d => d.target.x)
                .attr('y2', d => d.target.y);
            
            nodes
                .attr('cx', d => d.x)
                .attr('cy', d => d.y);
            
            labels
                .attr('x', d => d.x)
                .attr('y', d => d.y - d.size - 15);
            
            // 打印第一个节点的位置
            if (simulationData.nodes.length > 0) {
                const firstNode = simulationData.nodes[0];
                console.log('tick - Node:', firstNode.name, 'x:', firstNode.x.toFixed(2), 'y:', firstNode.y.toFixed(2));
            }
        });
        
        // 拖拽函数
        function dragstarted(event, d) {
            if (!event.active) simulation.alphaTarget(0.3).restart();
            d.fx = d.x;
            d.fy = d.y;
        }
        
        function dragged(event, d) {
            d.fx = event.x;
            d.fy = event.y;
        }
        
        function dragended(event, d) {
            if (!event.active) simulation.alphaTarget(0);
            d.fx = null;
            d.fy = null;
        }
        
        console.log('✅ 知识图谱渲染完成');
        console.log(' SVG 子元素:', svg.node().children.length);
        console.log(' circle 数量:', svg.selectAll('circle').size());
        console.log(' line 数量:', svg.selectAll('line').size());
        console.log(' text 数量:', svg.selectAll('text').size());
    </script>
</body>
</html>
