<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>D3.js 基础测试</title>
    <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
</head>
<body>
    <h1>D3.js 基础功能测试</h1>
    <div id="test-container" style="width: 600px; height: 400px; border: 1px solid #ccc;"></div>

    <script>
        console.log('开始D3.js测试');
        
        try {
            // 测试1: 创建SVG
            const container = document.getElementById('test-container');
            const svg = d3.select(container)
                .append("svg")
                .attr("width", 600)
                .attr("height", 400)
                .style("background-color", "#f0f0f0");
            
            console.log('SVG创建成功');
            
            // 测试2: 添加一个圆圈
            svg.append("circle")
                .attr("cx", 300)
                .attr("cy", 200)
                .attr("r", 50)
                .attr("fill", "blue")
                .attr("stroke", "white")
                .attr("stroke-width", 3);
                
            console.log('圆圈添加成功');
            
            // 测试3: 添加文本
            svg.append("text")
                .attr("x", 300)
                .attr("y", 200)
                .attr("text-anchor", "middle")
                .attr("fill", "black")
                .text("测试成功!")
                .attr("font-size", "20px");
                
            console.log('文本添加成功');
            
            // 测试4: 力导向模拟基础测试
            const nodes = [{id: 1, x: 100, y: 100}, {id: 2, x: 300, y: 200}, {id: 3, x: 500, y: 300}];
            
            const simulation = d3.forceSimulation(nodes)
                .force("center", d3.forceCenter(300, 200))
                .force("charge", d3.forceManyBody().strength(-30));
                
            console.log('力导向模拟创建成功');
            
            // 手动设置位置
            nodes.forEach(node => {
                node.x = node.x || 100 + Math.random() * 400;
                node.y = node.y || 100 + Math.random() * 200;
            });
            
            // 绘制节点
            svg.selectAll("circle.test-node")
                .data(nodes)
                .enter()
                .append("circle")
                .attr("class", "test-node")
                .attr("cx", d => d.x)
                .attr("cy", d => d.y)
                .attr("r", 20)
                .attr("fill", "red")
                .attr("stroke", "white")
                .attr("stroke-width", 2);
                
            console.log('测试节点渲染成功');
            
            document.body.innerHTML += '<p style="color: green;">✓ D3.js 基础功能测试通过！</p>';
            
        } catch (error) {
            console.error('D3.js测试失败:', error);
            document.body.innerHTML += '<p style="color: red;">✗ D3.js测试失败: ' + error.message + '</p>';
        }
    </script>
</body>
</html>
